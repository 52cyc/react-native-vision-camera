// App-local module: inherit the repository's Android/Kotlin toolchain versions.
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply from: '../nitrogen/generated/android/SnapPortNative+autolinking.gradle'

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get('reactNativeArchitectures')
  return value ? value.split(',') : ['armeabi-v7a', 'x86', 'x86_64', 'arm64-v8a']
}

android {
  namespace 'com.margelo.nitro.snapport'
  compileSdk rootProject.ext.compileSdkVersion
  ndkVersion rootProject.ext.ndkVersion

  defaultConfig {
    minSdk rootProject.ext.minSdkVersion
    targetSdk rootProject.ext.targetSdkVersion
    externalNativeBuild {
      cmake {
        cppFlags '-frtti -fexceptions -Wall -Wextra'
        arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
        abiFilters (*reactNativeArchitectures())
      }
    }
  }
  externalNativeBuild {
    cmake { path 'CMakeLists.txt' }
  }
  buildFeatures { prefab true }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
  packagingOptions {
    excludes = [
      '**/libc++_shared.so', '**/libNitroModules.so', '**/libfbjni.so',
      '**/libjsi.so', '**/libreactnative.so'
    ]
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation 'com.facebook.react:react-native:+'
  implementation project(':react-native-nitro-modules')
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
